[general]
# Colours and opacity come from this generated file (~/.i3rc/scripts/theme.sh,
# $mod+Shift+t). Define no [colors.*] or opacity here — this file would win.
# size.toml is the font size, and size.local.toml this machine's override of it
# (git-ignored, written by best-linux-environment). A missing import is skipped.
#
# colors.local.toml is last on purpose: best-linux-environment writes this
# machine's rolled cursor colour there, and the later import wins, so the theme
# toggle above keeps owning dark/light without taking the cursor with it.
import = [
    "~/.cache/alacritty-theme.toml",
    "~/.alacritty/size.toml",
    "~/.alacritty/size.local.toml",
    "~/.alacritty/colors.local.toml",
    # Last, so it beats the theme: best-linux-environment's BLE_TERMINAL_OPACITY.
    "~/.alacritty/opacity.local.toml",
]

[font]
# Cascadia Code only, no fallback family: anything outside its coverage (icons,
# powerline, U+23F8/U+23F5) is tofu. Upstream's static TTFs — the variable build
# reports no style=Bold/Italic, so the four lines below would all land on Regular.
normal = { family = "Cascadia Code", style = "Regular" }
bold = { family = "Cascadia Code", style = "Bold" }
italic = { family = "Cascadia Code", style = "Italic" }
bold_italic = { family = "Cascadia Code", style = "Bold Italic" }
# No `size` here: the importing file wins in Alacritty, so it would beat both
# imports above. It lives in size.toml — see there.

# Squashes the cell 7px → 6px: 159 columns half-screen instead of 136. At -1 the
# wide glyphs (m w M W) touch; 0 costs 23 columns, -2 is mush. Box drawing unaffected.
[font.offset]
x = -1

[window]
# No `opacity` here — the theme owns it, unless opacity.local.toml says otherwise.
# decorations = "none"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
